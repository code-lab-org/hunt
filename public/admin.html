<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="Multiplayer online stag hunting game">
    <meta name="author" content="Paul T. Grogan">
    <title>The Hunt</title>
    <link href="scripts/bootstrap/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="stylesheets/style.css" rel="stylesheet">
  </head>
  <body>
    <nav class="navbar navbar-expand-md bg-dark fixed-top" data-bs-theme="dark">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">The Hunt</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbar" aria-controls="navbar" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbar">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item" id="nav-login">
              <a class="nav-link" href="#" data-bs-toggle="modal" data-bs-target="#login">Sign In</a>
            </li>
            <li class="nav-item text-light d-none" id="nav-info">
              <span id="info"></span>
            </li>
          </ul>
        </div>
      </div>
    </nav>
    <main role="main" class="container my-3 border-start border-end border-light">
      <div class="row">
        <div class="col-lg-4">
          <h3>Setup</h3>
          <form>
            <div class="row mb-3">
              <label for="modeSelect" class="col-5 col-form-label">Points Mode:</label>
              <div class="col-7">
                <select class="form-select" id="modeSelect">
                  <option value="simple" selected>Simple</option>
                  <option value="complex">Complex</option>
                </select>
              </div>
            </div>
            <table class="table simple">
              <tr><th>&nbsp;</th><th>Hare</th><th>Stag</th></tr>
              <tr>
                <th>Hare</th>
                <td><input class="form-control" type="number" id="HH" value="2" step="0.01"></td>
                <td><input class="form-control" type="number" id="HS" value="3" step="0.01"></td>
              </tr>
              <tr>
                <th>Stag</th>
                <td><input class="form-control" type="number" id="SH" value="0" step="0.01"></td>
                <td><input class="form-control" type="number" id="SS" value="4" step="0.01"></td>
              </tr>
            </table>
            <table class="table complex" style="display:none;">
              <tr><th>&nbsp;</th><th>H/H</th><th>H/S</th><th>S/H</th><th>S/S</th></tr>
              <tr>
                <th>Atlatl</th>
                <td><input class="form-control" type="number" id="A-HH" value="0" step="0.01"></td>
                <td><input class="form-control" type="number" id="A-HS" value="0" step="0.01"></td>
                <td><input class="form-control" type="number" id="A-SH" value="0" step="0.01"></td>
                <td><input class="form-control" type="number" id="A-SS" value="4" step="0.01"></td>
              </tr>
              <tr>
                <th>Bow</th>
                <td><input class="form-control" type="number" id="B-HH" value="1" step="0.01"></td>
                <td><input class="form-control" type="number" id="B-HS" value="1" step="0.01"></td>
                <td><input class="form-control" type="number" id="B-SH" value="1.5" step="0.01"></td>
                <td><input class="form-control" type="number" id="B-SS" value="3.5" step="0.01"></td>
              </tr>
              <tr>
                <th>Club</th>
                <td><input class="form-control" type="number" id="C-HH" value="1" step="0.01"></td>
                <td><input class="form-control" type="number" id="C-HS" value="1" step="0.01"></td>
                <td><input class="form-control" type="number" id="C-SH" value="0.25" step="0.01"></td>
                <td><input class="form-control" type="number" id="C-SS" value="3.25" step="0.01"></td>
              </tr>
              <tr>
                <th>Dog</th>
                <td><input class="form-control" type="number" id="D-HH" value="2" step="0.01"></td>
                <td><input class="form-control" type="number" id="D-HS" value="3" step="0.01"></td>
                <td><input class="form-control" type="number" id="D-SH" value="0" step="0.01"></td>
                <td><input class="form-control" type="number" id="D-SS" value="0" step="0.01"></td>
              </tr>
            </table>
            <div class="row mb-3">
              <label for="probCollab" class="col-5 col-form-label">Robot P(Stag):</label>
              <div class="col-7">
                <input class="form-control" type="number" min="0" max="1" step="0.01" id="probCollab">
              </div>
            </div>
            <div class="row mb-3">
                <label for="selectPartners" class="col-5 col-form-label">Partners:</label>
                <div class="col-7">
                  <select class="form-select" id="selectPartners">
                    <option value="random">Random Robot</option>
                    <option value="hidden">Paired (Hidden)</option>
                    <option value="paired">Paired</option>
                  </select>
                </div>
            </div>
            <div class="d-flex flex-wrap justify-content-center align-items-center gap-3 my-4">
              <button type="button" class="btn" id="reset-game">Reset Game</button>
              <button type="button" class="btn btn-secondary" id="setup-partners">Setup</button>
              <div class="btn-group" role="group">
                <button type="button" class="btn btn-primary" id="score-game">Score Game</button>
                <button type="button" class="btn btn-outline-primary" id="execute-game">Execute...</button>
              </div>
            </div>
          </form>
        </div>
        <div class="col-lg-8">
          <ul class="nav nav-tabs" id="dashboard" role="tablist">
            <li class="nav-item">
              <a class="nav-link active" id="scoreboard-tab" data-bs-toggle="tab" href="#scoreboard" role="tab" aria-controls="scoreboard" aria-selected="true">Scoreboard</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" id="plot1-tab" data-bs-toggle="tab" href="#plotDecisions" role="tab" aria-controls="plotDecisions" aria-selected="false">Decisions</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" id="plot2-tab" data-bs-toggle="tab" href="#plotOutcomes" role="tab" aria-controls="plotOutcomes" aria-selected="false">Outcomes</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" id="plot3-tab" data-bs-toggle="tab" href="#plotDecisionTrajectory" role="tab" aria-controls="plotDecisionTrajectory" aria-selected="false">Decision Trajectory</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" id="plot4-tab" data-bs-toggle="tab" href="#plotOutcomeTrajectory" role="tab" aria-controls="plotOutcomeTrajectory" aria-selected="false">Outcome Trajectory</a>
            </li>
          </ul>
          <div class="tab-content" id="dashboard-content">
            <div class="tab-pane fade show active" id="scoreboard" role="tabpanel" aria-labelledby="scoreboard-tab">
              <table class="table table-striped">
                <thead class="table-dark">
                  <th scope="col">#</th>
                  <th scope="col">User</th>
                  <th scope="col">Score</th>
                </thead>
                <tbody></tbody>
              </table>
            </div>
            <div class="tab-pane fade" id="plotDecisions" role="tabpanel" aria-labelledby="plot1-tab">
              <canvas id="chartDecisions" width="100%"></canvas>
            </div>
            <div class="tab-pane fade" id="plotOutcomes" role="tabpanel" aria-labelledby="plot2-tab">
              <canvas id="chartOutcomes" width="100%"></canvas>
            </div>
            <div class="tab-pane fade" id="plotDecisionTrajectory" role="tabpanel" aria-labelledby="plot3-tab">
              <div class="chart-trajectory"><canvas id="chartDecisionTrajectory"></canvas></div>
            </div>
            <div class="tab-pane fade" id="plotOutcomeTrajectory" role="tabpanel" aria-labelledby="plot4-tab">
              <div class="chart-trajectory"><canvas id="chartOutcomeTrajectory"></canvas></div>
            </div>
          </div>
        </div>
      </div>
    </main>
    <footer class="site-footer bg-light text-center border-top border-dark">
      <p><small class="text-muted">&copy; 2026 Collective Design Lab</small></p>
    </footer>
    <div id="execute" class="modal fade" tabindex="-1" aria-labelledby="execute-title" aria-hidden="true">
      <div class="modal-dialog">
        <form class="modal-content" id="execute-form">
          <div class="modal-header">
            <h5 class="modal-title" id="execute-title">Execute Rounds</h5>
          </div>
          <div class="modal-body">
            <div class="row mb-3">
              <label for="executeRounds" class="col-7 col-form-label">Number of rounds:</label>
              <div class="col-5">
                <input class="form-control" type="number" id="executeRounds" min="1" step="1" value="10" required>
              </div>
            </div>
            <div class="row">
              <label for="executeDelay" class="col-7 col-form-label">Seconds between rounds:</label>
              <div class="col-5">
                <input class="form-control" type="number" id="executeDelay" min="0" step="any" value="5" required>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary">Run</button>
          </div>
        </form>
      </div>
    </div>
    <div id="login" class="modal" tabindex="-1" role="dialog" data-bs-backdrop="static" data-bs-keyboard="false">
      <div class="modal-dialog" role="document">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Log in</h5>
          </div>
          <div class="modal-body">
            <form class="form-login">
              <label for="inputPassword" class="visually-hidden">Admin password</label>
              <input type="password" id="inputPassword" class="form-control" placeholder="Admin password" required autofocus>
              <small id="login-error" class="form-text text-danger"></small>
              <button class="btn btn-lg btn-primary w-100" type="submit" id="login-submit">Sign in</button>
            </form>
          </div>
          <div class="modal-footer">
          </div>
      </div>
    </div>
    <script src="scripts/jquery/dist/jquery.slim.min.js"></script>
    <script src="scripts/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script src="scripts/chart.js/dist/chart.umd.min.js"></script>
    <script src="scripts/socket.io-client/dist/socket.io.js"></script>
    <script src="javascripts/admin.js"></script>
  </body>
</html>
